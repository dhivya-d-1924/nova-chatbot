name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - name: Install system packages (OCR, redis-server for the shared-limiter test)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr redis-server
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Production config check fails on unsafe settings
        run: |
          ! APP_ENV=production python -c "from nova import create_app; create_app({'_SKIP_ENV_FILE': '1'})"
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.txt
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium firefox webkit
      - name: End-to-end (Chromium desktop + phones/tablets, Firefox, WebKit/Safari)
        working-directory: frontend
        env: { E2E_ALL_BROWSERS: "1", E2E_PYTHON: python }
        run: npm run test:e2e -- --project=desktop-chromium --project=mobile-320 --project=iphone-portrait --project=tablet-ipad --project=desktop-firefox --project=desktop-webkit --project=iphone-webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nova:ci .
      - name: Container starts and becomes healthy
        run: |
          docker run -d --name nova -p 8000:8000 -e SECRET_KEY=$(python3 -c "import secrets;print(secrets.token_hex(32))") \
            -e APP_URL=https://nova.example.com -e ALLOWED_ORIGINS=https://nova.example.com -e ALLOW_INSECURE_HTTP=true nova:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health/ready && exit 0; sleep 2; done
          docker logs nova; exit 1
